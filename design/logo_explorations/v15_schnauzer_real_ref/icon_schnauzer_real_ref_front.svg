<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#8FBFA3" />

  <!-- Schnauzer ears (folded V shape) -->
  <path d="M36 35 L24 31 L30 49 Z" fill="#5B636D" />
  <path d="M72 35 L84 31 L78 49 Z" fill="#5B636D" />
  <path d="M35 36 L29 34 L31.5 43 Z" fill="#7A828C" />
  <path d="M73 36 L79 34 L76.5 43 Z" fill="#7A828C" />

  <!-- Salt-and-pepper head -->
  <ellipse cx="54" cy="52" rx="24" ry="22.5" fill="#B9C0C8" />

  <!-- Schnauzer muzzle + beard (key breed markers) -->
  <ellipse cx="54" cy="62" rx="11.5" ry="9" fill="#E7EBEF" />
  <path d="M43 64 C41 72 42 80 54 87 C66 80 67 72 65 64 Z" fill="#EDF0F3" />

  <!-- Distinct schnauzer eyebrows -->
  <path d="M42 48 C45 46 49 46 51 48 C48 49.8 44 50 42 48 Z" fill="#4E5761" />
  <path d="M66 48 C63 46 59 46 57 48 C60 49.8 64 50 66 48 Z" fill="#4E5761" />

  <!-- Eyes -->
  <ellipse cx="47" cy="52" rx="2.3" ry="2.2" fill="#162228" />
  <ellipse cx="61" cy="52" rx="2.3" ry="2.2" fill="#162228" />
  <circle cx="46.3" cy="51.4" r="0.55" fill="#FFFFFF" />
  <circle cx="60.3" cy="51.4" r="0.55" fill="#FFFFFF" />

  <!-- Nose + moustache -->
  <path d="M54 56 L57.5 60 H50.5 Z" fill="#131C22" />
  <rect x="53.35" y="60" width="1.3" height="4.2" rx="0.65" fill="#131C22" />
  <ellipse cx="49.2" cy="66.8" rx="4.8" ry="1.9" fill="#BAC1C9" />
  <ellipse cx="58.8" cy="66.8" rx="4.8" ry="1.9" fill="#BAC1C9" />

  <!-- Mouth/tongue -->
  <ellipse cx="50.7" cy="70.8" rx="2.5" ry="0.9" fill="#38434C" />
  <ellipse cx="57.3" cy="70.8" rx="2.5" ry="0.9" fill="#38434C" />
  <ellipse cx="54" cy="73.3" rx="1.6" ry="1.3" fill="#F08E84" />

  <!-- Light whisker accents -->
  <path d="M44.5 67.8 L38.8 69.1" stroke="#C9CED4" stroke-width="0.8" stroke-linecap="round" />
  <path d="M63.5 67.8 L69.2 69.1" stroke="#C9CED4" stroke-width="0.8" stroke-linecap="round" />
</svg>
